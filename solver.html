<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Hamara Solver</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="poker.css">
<style>
.top{padding:14px 0 8px}h1{font-size:26px}
.panel{margin-bottom:10px;padding:12px}
.pl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;direction:ltr}
.pl button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font:800 18px Heebo,sans-serif;cursor:pointer}
.pl button.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.board{display:flex;gap:6px;direction:ltr;align-items:flex-end;justify-content:center;flex-wrap:nowrap}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.grp .t{font-size:11px;color:var(--mut)}
.grp .row2{display:flex;gap:4px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.s{width:44px;height:62px;border-radius:8px;border:1.5px dashed #3a4150;background:var(--panel2);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.s.on{border:2px solid var(--gold)}
.s:not(.empty){border-style:solid;background:transparent}
.s .card{width:42px;height:60px}.s .card b{font-size:18px}.s .card i{font-size:16px}
.verdict{border:2px solid;border-radius:14px;padding:14px;margin-bottom:12px;min-height:96px}
.verdict .v{font-size:32px;font-weight:800;line-height:1.1}
.verdict .sub{font-size:14px;margin-top:4px;color:var(--txt)}
.verdict .stats{display:flex;gap:22px;margin-top:10px;align-items:flex-end;flex-wrap:wrap}
.verdict .stats>div{display:flex;flex-direction:column;gap:2px}
.verdict .bign{font:800 34px "JetBrains Mono",monospace;line-height:1;white-space:nowrap;direction:ltr;text-align:right}
.verdict small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.new{width:100%;background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font:500 16px Heebo,sans-serif;cursor:pointer;margin-top:10px}
.dc{font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div><h1>Hamara <span>Solver</span></h1></div>
  <nav><a href="index.html">טבלה</a><a href="practice.html">תרגול</a></nav>
</header>

<section class="panel">
  <div class="lbl">כמה משחקים ביד (כולל אותי)</div>
  <div class="pl" id="pl"></div>
</section>

<section class="panel">
  <div class="board" id="slots"></div>
</section>

<section class="panel" style="padding:10px">
  <div class="deck" id="deck" style="margin-top:0"></div>
</section>

<div class="verdict" id="verdict" style="border-color:#3a4150"></div>
<button class="new" id="newBtn" style="margin:0 0 12px">🔄 יד חדשה</button>

<footer>
  סיכויי הזכייה הם חישוב אמיתי (סימולציה), מול יריבים עם <i>ידיים אקראיות</i>. מי שמהמר או משווה בדרך כלל מחזיק יד טובה יותר – אז מול הימור גדול, תהיה זהיר מהמספר.
  לפני הפלופ ההמלצה לא יודעת איפה אתה יושב.
  <br><a href="recorder.html" style="color:var(--mut)">מצב מלא – רישום כל הפעולות בשולחן</a>
</footer>

<script src="engine.js"></script>
<script src="cards.js"></script>
<script>
const H=window.HS,$=id=>document.getElementById(id);
let players=4;try{const v=+localStorage.getItem('hamara_players');if(v>=2&&v<=9)players=v}catch(e){}
let cards=[null,null,null,null,null,null,null]; // 0-1 me, 2-4 flop, 5 turn, 6 river
let target=null;

function drawPlayers(){
  $('pl').innerHTML=[2,3,4,5,6,7,8,9].map(n=>`<button class="${n===players?'on':''}" data-n="${n}">${n}</button>`).join('');
  $('pl').querySelectorAll('button').forEach(b=>b.onclick=()=>{players=+b.dataset.n;try{localStorage.setItem('hamara_players',players)}catch(e){};render()});
}
const nextEmpty=()=>{const i=cards.findIndex(c=>c===null);return i<0?null:i};
function slot(i){const c=cards[i],on=(target??nextEmpty())===i;return `<button class="s ${on?'on':''} ${c===null?'empty':''}" data-i="${i}">${c===null?'':CARD.html(c)}</button>`}
function drawSlots(){
  $('slots').innerHTML=`<div class="grp"><div class="t">שלי</div><div class="row2">${slot(0)}${slot(1)}</div></div><div class="sep"></div>
    <div class="grp"><div class="t">פלופ</div><div class="row2">${slot(2)}${slot(3)}${slot(4)}</div></div>
    <div class="grp"><div class="t">טרן</div><div class="row2">${slot(5)}</div></div>
    <div class="grp"><div class="t">ריבר</div><div class="row2">${slot(6)}</div></div>`;
  $('slots').querySelectorAll('.s').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;cards[i]=null;target=i;render()});
}
function drawDeck(){
  const u=new Set(cards.filter(c=>c!==null)),full=nextEmpty()===null&&target===null;let h='';
  for(let s=0;s<4;s++)for(let r=12;r>=0;r--){const c=r*4+s;h+=`<button class="dc ${CARD.suitCls(c)} ${u.has(c)||full?'used':''}" data-c="${c}">${CARD.rank(c)}<small>${CARD.suit(c)}</small></button>`}
  $('deck').innerHTML=h;
  $('deck').querySelectorAll('.dc').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(u.has(c))return;const t=target??nextEmpty();if(t==null)return;cards[t]=c;target=null;render()});
}
function drawsTxt(hero,board){
  if(board.length>=5||board.length<3)return '';const all=hero.concat(board),out=[];
  const sc=[0,0,0,0];all.forEach(c=>sc[c&3]++);const fs=sc.findIndex(x=>x===4);
  if(fs>=0&&hero.some(c=>(c&3)===fs))out.push('דרואו לצבע');
  const rs=new Set(all.map(c=>c>>2));if(rs.has(12))rs.add(-1);const hr=new Set(hero.map(c=>c>>2));if(hr.has(12))hr.add(-1);
  let oe=false,gs=false;
  for(let lo=-1;lo<=8;lo++){const w=[0,1,2,3,4].map(k=>lo+k),have=w.filter(r=>rs.has(r));if(have.length===5)return '';
    if(have.length===4&&w.some(r=>hr.has(r))){const miss=w.find(r=>!rs.has(r));if(miss===lo||miss===lo+4)oe=true;else gs=true}}
  if(oe)out.push('דרואו פתוח לרצף');else if(gs)out.push('דרואו לרצף (באמצע)');
  return out.length?' + '+out.join(', '):'';
}
let tok=0;
function drawVerdict(){
  const hero=cards.slice(0,2),board=cards.slice(2).filter(c=>c!==null);
  if(hero.some(c=>c===null)){$('verdict').style.borderColor='#3a4150';$('verdict').innerHTML=`<div class="v" style="color:var(--mut);font-size:22px">בחר את 2 הקלפים שלך ↓</div>`;return}
  const contiguous=cards.slice(2,2+board.length).every(c=>c!==null);
  if(!contiguous||board.length===1||board.length===2){$('verdict').style.borderColor='#3a4150';$('verdict').innerHTML=`<div class="v" style="color:var(--mut);font-size:22px">${board.length<3?`עוד ${3-board.length} קלפים לפלופ ↓`:'השלם את הלוח ↓'}</div>`;return}
  const opps=players-1,t=++tok;
  $('verdict').innerHTML=`<div class="v" style="color:var(--mut);font-size:22px">מחשב…</div>`;
  setTimeout(()=>{if(t!==tok)return;
    const r=H.equity(hero,board,opps,board.length?15000:12000),eq=r.eq,fair=1/players;
    const hand=H.cardsToHand(hero[0],hero[1]);
    let v,c,sub;
    if(!board.length){
      const top=H.RANK[hand]*100,place=H.ORDER.indexOf(hand)+1;
      if(top<=8){v='חזק – להעלות';c='#e8457a';sub='יד מצוינת. להעלות, וגם להשוות להעלאה של אחרים.'}
      else if(top<=25){v='סביר – להיכנס';c='#2fbf71';sub='טובה כשאתה מאוחר בשולחן (ליד הדילר). אם יש העלאה גדולה לפניך – להיזהר.'}
      else if(top<=45){v='גבולי';c='#f5b70a';sub='רק אם נכנסים זול ואף אחד לא העלה.'}
      else{v='חלש – לקפל';c='#5b7fd6';sub='לא שווה להיכנס.'}
      sub+=` <span style="color:var(--mut)">(${hand} – מקום ${place} מתוך 169)</span>`;
    }else{
      if(eq>=Math.max(0.5,fair*1.6)){v='חזק – להמר';c='#e8457a';sub='להמר בערך ⅔ קופה. אם מהמרים עליך – להעלות או להשוות.'}
      else if(eq>=fair){v='בינוני – צ׳ק / להשוות';c='#2fbf71';sub='להשוות הימור קטן-בינוני. מול הימור גדול – לחשוב פעמיים.'}
      else{v='חלש – צ׳ק / לקפל';c='#5b7fd6';sub='אם מהמרים עליך – לקפל.'}
    }
    const made=board.length?H.CAT[Math.floor(H.eval7(hero.concat(board))/1e6)]+drawsTxt(hero,board):null;
    $('verdict').style.borderColor=c;
    $('verdict').innerHTML=`<div class="v" style="color:${c}">${v}</div><div class="sub">${sub}</div>
      <div class="stats"><div><div class="bign">${(eq*100).toFixed(0)}%</div><small>סיכוי לנצח מול ${opps} ${opps>1?'יריבים':'יריב'}</small></div>
      <div><div class="bign" style="font-size:22px;color:var(--mut)">${(fair*100).toFixed(0)}%</div><small>הממוצע בשולחן</small></div></div>
      ${made?`<div class="sub" style="margin-top:10px">יש לך: <b>${made}</b></div>`:''}`;
  },10);
}
$('newBtn').onclick=()=>{cards=[null,null,null,null,null,null,null];target=null;render();window.scrollTo({top:0,behavior:'smooth'})};
// links: ?h=KcJc&b=6cTs5d&n=4
(function(){const q=new URLSearchParams(location.search);const P=s=>{const o=[];const t=(s||'').replace(/10/g,'T');for(let i=0;i+1<t.length;i+=2){const r='23456789TJQKA'.indexOf(t[i].toUpperCase()),u='shdc'.indexOf(t[i+1].toLowerCase());if(r>=0&&u>=0)o.push(r*4+u)}return o};
  const n=+q.get('n');if(n>=2&&n<=9)players=n;const h=P(q.get('h')),b=P(q.get('b'));h.slice(0,2).forEach((c,i)=>cards[i]=c);b.slice(0,5).forEach((c,i)=>cards[2+i]=c)})();
function render(){drawPlayers();drawSlots();drawDeck();drawVerdict()}
render();
</script>
</body>
</html>
